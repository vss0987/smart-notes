services:
  frontend:
    image: sergeyv1987/smart-notes-frontend:latest
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    image: sergeyv1987/smart-notes-backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - ai_service

  ai_service:
    image: sergeyv1987/smart-notes-ai_service:latest
    ports:
      - "8001:8001"
    env_file:
      - .env